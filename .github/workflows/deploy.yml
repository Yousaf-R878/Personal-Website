name: Deploy Personal Website to LXC (Self-Hosted Runner)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /opt/Personal-Website
          git pull

      - name: Rebuild and restart Docker Compose stack
        run: |
          cd /opt/Personal-Website
          docker compose down
          docker compose up -d --build
